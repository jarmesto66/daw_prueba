<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TecnoShop</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>
  <header class="cabecera">
    <h1>TecnoShop</h1>
    <span id="cabecera-carrito">Carrito (0)</span>
  </header>

  <main class="contenido">
    <!-- CATÁLOGO -->
    <section class="catalogo" aria-labelledby="titulo-catalogo">
      <div class="barra">
        <h2 id="titulo-catalogo">Catálogo</h2>
        <select id="filtro" aria-label="Filtrar por tipo">
          <option value="todos">Todos</option>
          <option value="sobremesa">Sobremesa</option>
          <option value="portatil">Portátiles</option>
        </select>
        <button id="btn-ordenar" type="button" aria-pressed="false">Ordenar por precio</button>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <aside class="lateral">
      <!-- CARRITO -->
      <section class="panel" aria-labelledby="titulo-carrito">
        <h2 id="titulo-carrito">Tu carrito</h2>
        <ul id="lista-carrito" class="lista-carrito"></ul>
        <p class="total"><span>Total</span> <strong id="total-carrito">0 €</strong></p>
        <p id="cantidad-carrito" class="nota">El carrito está vacío</p>
        <button id="btn-vaciar" type="button" class="btn-secundario">Vaciar carrito</button>
      </section>

      <!-- FORMULARIO (novalidate: la validación la hacemos en JS) -->
      <section class="panel" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Nuevo producto</h2>
        <form id="form-producto" novalidate>
          <div class="campos">
            <label>Tipo
              <select id="f-tipo">
                <option value="sobremesa">Sobremesa</option>
                <option value="portatil">Portátil</option>
              </select>
            </label>
            <label>Marca
              <input type="text" id="f-marca">
            </label>
            <label>Modelo
              <input type="text" id="f-modelo">
            </label>
            <label>Precio (€)
              <input type="number" id="f-precio" min="0" step="any">
            </label>
            <label>RAM (GB)
              <input type="number" id="f-ram" min="0" placeholder="opcional">
            </label>
            <label>Disco (GB)
              <input type="number" id="f-disco" min="0" placeholder="opcional">
            </label>
            <label>Pulgadas
              <input type="number" id="f-pulgadas" min="0" step="any" placeholder="opcional">
            </label>
            <label id="campo-autonomia" hidden>Autonomía (h)
              <input type="number" id="f-autonomia" min="0" step="any" placeholder="opcional">
            </label>
          </div>
          <p id="error-form" class="error" role="alert"></p>
          <button type="submit">Añadir producto</button>
        </form>
      </section>
    </aside>
  </main>

  <script src="./js/app.js"></script>
</body>

</html>
